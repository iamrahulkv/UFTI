name: Android
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths: ['android/**', 'public/**', 'test/android-interop.js', '.github/workflows/android.yml']
    tags: ['android-v*']
  pull_request:
    paths: ['android/**', 'public/**', 'test/android-interop.js']
permissions:
  contents: write
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unit tests (server on the JVM, plus a Node client talking to it)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --console=plain
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --console=plain
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk UFTI-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UFTI-android
          path: UFTI-android.apk
      # Pushing a tag such as android-v1.0.0 publishes the APK as a GitHub release.
      - name: Name the file for the release
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: cp UFTI-android.apk "UFTI-Android-${GITHUB_REF_NAME#android-v}.apk"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/android-v')
        with:
          name: UFTI for Android ${{ github.ref_name }}
          make_latest: false   # the "latest" release stays the Windows app
          body: |
            UFTI for Android: the phone hosts UFTI, shows a QR code, and a Windows PC, an iPhone, another Android phone or any browser scans it to send and receive files. The app can also scan another UFTI's QR code.

            **Download `UFTI-Android-*.apk` below** and open it on the phone (allow "Install unknown apps" for your browser or Files app when Android asks).
            Guide: [docs/ANDROID-APP.md](https://github.com/iamrahulkv/UFTI/blob/main/docs/ANDROID-APP.md)
          files: UFTI-Android-*.apk
