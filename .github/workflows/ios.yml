name: iOS
on:
  workflow_dispatch:
  push:
    paths: ['ios/**', 'public/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'public/**']
permissions:
  contents: read
jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project UFTI.xcodeproj -scheme UFTI -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package the .ipa
        working-directory: ios
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/UFTI.app Payload/
          zip -qr UFTI-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: UFTI-ios-unsigned
          path: ios/UFTI-ios-unsigned.ipa
