name: iOS
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths: ['ios/**', 'public/**', '.github/workflows/ios.yml']
    tags: ['ios-v*']
  pull_request:
    paths: ['ios/**', 'public/**']
permissions:
  contents: write
jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project UFTI.xcodeproj -scheme UFTI -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package the .ipa
        working-directory: ios
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/UFTI.app Payload/
          zip -qr UFTI-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UFTI-ios-unsigned
          path: ios/UFTI-ios-unsigned.ipa
      # Pushing a tag such as ios-v1.0.0 publishes the .ipa as a GitHub release.
      - name: Name the file for the release
        if: startsWith(github.ref, 'refs/tags/ios-v')
        run: cp ios/UFTI-ios-unsigned.ipa "ios/UFTI-iOS-unsigned-${GITHUB_REF_NAME#ios-v}.ipa"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/ios-v')
        with:
          name: UFTI for iPhone ${{ github.ref_name }}
          make_latest: false   # the "latest" release stays the Windows app
          body: |
            UFTI for iPhone: the iPhone hosts UFTI and another phone scans its QR code to send and receive files.

            **Download `UFTI-iOS-unsigned-*.ipa` below.** It is unsigned, so install it with AltStore or Sideloadly and your free Apple ID.
            Step-by-step guide: [docs/INSTALL-IPHONE.md](https://github.com/iamrahulkv/UFTI/blob/main/docs/INSTALL-IPHONE.md)

            Free Apple ID installs expire after 7 days and need refreshing (AltStore does this for you).
          files: ios/UFTI-iOS-unsigned-*.ipa
