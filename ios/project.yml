# XcodeGen spec. `xcodegen generate` (run in this folder) creates UFTI.xcodeproj.
# The web UI is the same public/ folder the Windows app uses, bundled as a folder reference.
name: UFTI
options:
  bundleIdPrefix: com.ufti
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "3"
targets:
  UFTI:
    type: application
    platform: iOS
    sources:
      - path: UFTI
      - path: ../public
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ufti.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: UFTI/Info.plist
      properties:
        CFBundleDisplayName: UFTI
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Received files live in Documents/received, so they show up in the Files app under UFTI.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: UFTI shares files with phones on your Wi-Fi.
        # The camera scans the QR code of another UFTI, and the page's file picker offers "Take Photo or Video".
        NSCameraUsageDescription: Scan a UFTI QR code, or take a photo or video to send.
        NSMicrophoneUsageDescription: Record video with sound to send.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
